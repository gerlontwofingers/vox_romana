# vox_romana.example.yaml
# ──────────────────────────────────────────────────────────────────────────────
# COPY THIS FILE → vox_romana.yaml (in this same folder, next to run.py)
# then edit the values below to point to wherever you want your files to live.
#
# vox_romana.yaml is in .gitignore — your local paths won't be committed.
# ──────────────────────────────────────────────────────────────────────────────
#
# CONFIG FILE PRECEDENCE
# ──────────────────────────────────────────────────────────────────────────────
# vox_romana looks for configuration in two places, in this order:
#
#   1. vox_romana.yaml  (this folder, next to run.py) — takes precedence.
#      Any key set here overrides the same key in the user config below.
#
#   2. ~/.vox_romana/config.yaml  (user home, system-wide) — fallback.
#      Copy config.yaml.example there for shared defaults across projects.
#
# ──────────────────────────────────────────────────────────────────────────────


# WHERE ALL OUTPUT AND DATA LIVES
# ──────────────────────────────────────────────────────────────────────────────
# All generated files (show JSON, audio, catalog DB, memory index) go under
# this single directory.  Subfolders are created automatically.
#
# Leave commented out to use the default: ~/.vox_romana/
#
# Examples:
#   data_dir: ~/vox_romana_data
#   data_dir: /Volumes/BigDisk/vox_romana
#   data_dir: /Users/yourname/Desktop/vox_romana_output

# data_dir: ~/vox_romana_data


# PRODUCTION ID (longitudinal data store)
# ──────────────────────────────────────────────────────────────────────────────
# Short stable slug that identifies this installation in longitudinal.db.
# Used by `python tools/studio.py ingest` and `tools/study_battery.py`.
# Change this if you run multiple studios and want to track them separately.

production_id: default


# PIPER VOICE MODELS (optional override)
# ──────────────────────────────────────────────────────────────────────────────
# Where your downloaded Piper TTS voice .onnx files live.
# By default this is data_dir/piper-voices/.
# Only set this if your voices are stored somewhere else entirely.
#
# Example:
#   piper_voices_dir: /Volumes/BigDisk/piper-voices

# piper_voices_dir: ~/piper-voices


# VOICE CLONE PROFILES (optional override)
# Where cloned voice profiles (reference.wav + metadata.json) are stored.
# Defaults to data_dir/voice_profiles/ if not set.
#
# Example:
#   voice_profiles_dir: /Volumes/BigDisk/voice_profiles

# voice_profiles_dir: ~/vox_romana_data/voice_profiles


# ──────────────────────────────────────────────────────────────────────────────
# FOLDER LAYOUT UNDER data_dir
# ──────────────────────────────────────────────────────────────────────────────
# Once you set data_dir, your files will be organised like this:
#
#   data_dir/
#     output/
#       text/
#         debates/          ← generated show JSON files (debates)
#         news/             ← generated show JSON files (news)
#         podcasts/         ← generated show JSON files (podcasts)
#         analysis/         ← emotion flow HTML reports
#         emotion_flow/     ← emotion flow pipeline output
#       audio/
#         debates/          ← rendered audio files (debates)
#         news/             ← rendered audio files (news)
#         podcasts/         ← rendered audio files (podcasts)
#     vox_romana.db         ← show catalog (SQLite)
#     piper-voices/         ← Piper TTS voice models
#     memory/
#       chroma/             ← vector search index
#       documents/          ← ingested document chunks
#       encoder/            ← fine-tuned embedding model
#       lm/                 ← fine-tuned language model adapters
#       corpus/             ← corpus files
#     university/           ← Scholar research sessions
#       index.json          ← session registry
#       {session_id}/       ← per-session folder
#         session.json      ← session state
#         notes.jsonl       ← article notes (DocumentIngester-compatible)
#     wikipedia_cache/      ← cached Wikipedia article JSON files


# ── UNIVERSITY (LOCAL DEEP RESEARCH) ─────────────────────────────────────────
# Runs a Scholar agent locally via Ollama (free, no API calls).
# The Scholar iteratively reads Wikipedia (and your local memory corpus)
# and builds structured research notes and a running synthesis.
#
# SETUP:
#   brew install ollama
#   ollama pull deepseek-r1:7b    # or whichever size fits your hardware
#   ollama serve                  # starts the local API on :11434
#
# MODEL SIZE GUIDE:
#   deepseek-r1:1.5b  — CPU-only fallback        (~2  GB RAM)
#   deepseek-r1:7b    — Apple M 16 GB / RTX 8 GB  (~8  GB RAM)
#   deepseek-r1:14b   — Apple M 32 GB / RTX 12 GB (~14 GB RAM)
#   deepseek-r1:32b   — Apple M 64 GB / RTX 24 GB (~32 GB RAM)
#
# USAGE:
#   python run.py --mode university study "Japanese cars" --hours 3
#   python run.py --mode university ask "First car exported to USA?" --session abc123
#   python run.py prompt.yaml --research --university-session abc123

university:
  reading_model: deepseek-r1:7b       # fast model for per-article note extraction
  synthesis_model: deepseek-r1:14b    # quality model for synthesis passes
  openalex_enabled: true              # query OpenAlex (200M academic works, free, no key)
  colloquium_enabled: true            # cross-pollinate Scholars in seminar mode
  colloquium_interval: 25             # articles per Scholar between colloquium rounds
  colloquium_max_leads_per_peer: 3    # search hits enqueued per peer-suggested query
  colloquium_snippet_chars: 1500      # synthesis chars shared with each peer
  colloquium_extra_secs: 600          # extra deadline seconds reserved for colloquium phase
  base_url: http://localhost:11434/v1
  temperature: 0.6
  timeout_secs: 300          # seconds per LLM call (long articles need more)
  notes_per_synthesis: 10    # update running synthesis every N articles
  max_links_per_article: 15  # cap outbound links added to queue per article
  relevance_threshold: 4.0   # 0–10; links scoring below this are discarded
  max_queue_size: 500        # prevent unbounded graph traversal
  wikipedia_cache_ttl_days: 30  # 0 = always re-fetch
